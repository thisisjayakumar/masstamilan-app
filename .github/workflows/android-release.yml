name: Android Release APK

# Builds + unit-tests on every push/PR; attaches a signed (or unsigned)
# release APK as a run artifact. Pushing a tag like v1.0.0 additionally
# publishes a GitHub Release with the APK attached.
#
# Optional signing (recommended for production): add these repository secrets:
#   MASSTAMILAN_KEYSTORE_BASE64  - base64 of your release keystore
#     (generate: keytool -genkeypair -keystore release.keystore -alias masstamilan -keyalg RSA -keysize 2048 -validity 10000)
#     (encode:    base64 -w0 release.keystore)
#   MASSTAMILAN_KEYSTORE_PASSWORD
#   MASSTAMILAN_KEY_ALIAS
#   MASSTAMILAN_KEY_PASSWORD
# Without them the build still succeeds and uploads Masstamilan_<version>.apk (unsigned).
# Never commit a keystore file (see .gitignore) - linqmusic-style committed
# keystores leak your signing identity.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No setup-android step: ubuntu-latest runners already ship a full
      # SDK (ANDROID_HOME preset). The setup-android action is currently
      # broken - it tries to install the obsolete `tools` package and fails.
      - name: Confirm preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v3

      - name: Restore release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.MASSTAMILAN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/masstamilan-release.keystore"
            echo "Keystore restored - release APK will be signed."
          else
            echo "No keystore secret - release APK will be unsigned."
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          MASSTAMILAN_KEYSTORE_PATH: ${{ runner.temp }}/masstamilan-release.keystore
          MASSTAMILAN_KEYSTORE_PASSWORD: ${{ secrets.MASSTAMILAN_KEYSTORE_PASSWORD }}
          MASSTAMILAN_KEY_ALIAS: ${{ secrets.MASSTAMILAN_KEY_ALIAS }}
          MASSTAMILAN_KEY_PASSWORD: ${{ secrets.MASSTAMILAN_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: masstamilan-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: masstamilan-release-apk
          path: apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
